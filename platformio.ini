[platformio]
default_envs = esp32c3_st7789

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
board_build.mcu = esp32c3

; -------------------------------------------------------------
; Environment: ESP32-C3 + 1.3" 240x240 ST7789 IPS LCD (SPI)
; -------------------------------------------------------------
[env:esp32c3_st7789]
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DUSE_ST7789
lib_deps = 
    lovyan03/LovyanGFX @ ^1.1.16

; -------------------------------------------------------------
; Environment: ESP32-C3 + SSD1306 128x64 Monochrome OLED (I2C)
; -------------------------------------------------------------
[env:esp32c3_ssd1306]
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DUSE_SSD1306
lib_deps = 
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
